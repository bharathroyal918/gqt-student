version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gqt_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gqt_portal_db}
      POSTGRES_USER: ${POSTGRES_USER:-gqt_portal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gqt_portal_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - gqt_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gqt_portal_user} -d ${POSTGRES_DB:-gqt_portal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gqt_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - gqt_redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gqt_postgres_dev_data:
  gqt_redis_dev_data:
